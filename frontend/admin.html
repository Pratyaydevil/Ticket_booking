<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — TicketBox</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="wrap">
    <h2 class="page-title">Create a venue</h2>
    <div class="panel">
      <form class="form wide" id="venueForm">
        <label class="field">Venue name <input name="name" required minlength="2"></label>
        <label class="field">City <input name="city" required minlength="2"></label>
        <div>
          <div class="small dim" style="margin-bottom:8px">Seat layout — blocks
            front to back (rows are auto-labelled A, B, C…):</div>
          <div id="blocks" class="form" style="gap:8px"></div>
          <button class="btn ghost small" type="button" id="addBlock"
            style="margin-top:8px">+ Add block</button>
        </div>
        <button class="btn gold" type="submit">Create venue</button>
      </form>
    </div>

    <h2 class="page-title">Venues</h2>
    <div id="venues" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

<script src="js/app.js"></script>
<script>
const { api, errMsg, getUser, renderNav, toast, requireLogin } = TBS;
renderNav("admin");
const user = getUser();
if (requireLogin("admin.html")) {
  if (!user || user.role !== "admin") {
    document.querySelector(".wrap").innerHTML =
      '<div class="notice red" style="margin-top:40px">This page needs the admin account.</div>';
  } else { init(); }
}

function blockRow(category = "", rows = 1, perRow = 8) {
  const div = document.createElement("div");
  div.className = "kv";
  div.style.gap = "8px";
  div.innerHTML = `
    <input placeholder="Category (e.g. Premium)" value="${category}"
           data-b="category" required style="flex:1">
    <input type="number" min="1" max="26" value="${rows}" data-b="rows"
           title="Rows" style="width:70px">
    <input type="number" min="1" max="40" value="${perRow}" data-b="per"
           title="Seats per row" style="width:70px">
    <button class="btn danger small" type="button">×</button>`;
  div.querySelector("button").onclick = () => div.remove();
  return div;
}

const blocks = document.getElementById("blocks");
blocks.appendChild(blockRow("Premium", 2, 8));
blocks.appendChild(blockRow("Standard", 5, 10));
document.getElementById("addBlock").onclick = () => blocks.appendChild(blockRow());

document.getElementById("venueForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const body = { name: f.get("name"), city: f.get("city"), blocks: [] };
  blocks.querySelectorAll(".kv").forEach(row => body.blocks.push({
    category: row.querySelector('[data-b="category"]').value,
    rows: Number(row.querySelector('[data-b="rows"]').value),
    seats_per_row: Number(row.querySelector('[data-b="per"]').value),
  }));
  try {
    const res = await api("/api/admin/venues", { method: "POST", body });
    toast(`Venue created with ${res.total_seats} seats.`, "success");
    ev.target.reset(); loadVenues();
  } catch (e) { toast(errMsg(e), "error"); }
});

async function loadVenues() {
  try {
    const venues = await api("/api/venues");
    document.getElementById("venues").innerHTML = venues.map(v => `
      <div class="panel kv"><span><b>${v.name}</b>, ${v.city}</span>
        <span class="dim small mono">${v.total_seats} seats ·
          ${v.categories.join(" / ")}</span></div>`).join("")
      || '<div class="empty">No venues yet.</div>';
  } catch (e) { toast(errMsg(e), "error"); }
}

function init() { loadVenues(); }
</script>
</body>
</html>
